name: dalabapay
description: A modern fintech app
publish_to: 'none'

version: 1.5.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.9.0
  http: ^1.5.0
  connectivity_plus: ^7.0.0

  # Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Authentication
  local_auth: ^2.3.0

  # UI
  google_fonts: ^6.3.0
  flutter_svg: ^2.2.0
  shimmer: ^3.0.0
  animations: ^2.0.11
  flutter_animate: ^4.5.2
  page_transition: ^2.2.1
  animated_splash_screen: ^1.3.0
  hugeicons: ^1.0.0
  excel: ^4.0.6
  pdf: ^3.11.1
  printing: ^5.13.0
  path_provider: ^2.1.0
  image_network: ^2.5.4

  # Components
  fl_chart: ^1.1.0
  carousel_slider: ^5.1.1
  smooth_page_indicator: ^1.2.1
  animated_text_kit: ^4.2.3
  flutter_staggered_animations: ^1.1.1
  flutter_screenutil: ^5.9.0
  cached_network_image: ^3.3.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_app_badger: ^1.5.0

  # Icons
  iconsax: ^0.0.8


  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  mime: ^1.0.6
  http_parser: ^4.1.2
  timezone: ^0.9.4
  encrypt: ^5.0.3
  synchronized: ^3.4.0
  share_plus: ^12.0.2
  package_info_plus: ^9.0.1
  socket_io_client: ^2.0.3+1
  flutter_local_notifications: ^17.0.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  syncfusion_flutter_charts: ^34.2.3
  

  # Device
  permission_handler: ^12.0.1
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  image_picker: ^1.2.3
  flutter_native_contact_picker: ^0.0.8


dependency_overrides:
  firebase_core_web: 3.10.0
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/dabalogo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"